
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0f17">
  <title>Bubble AI — Aqlli o‘qituvchi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot">●</span>
      <strong>Bubble AI</strong>
    </div>
    <div class="top-actions">
      <button id="bMenu" type="button">📚 Tarix</button>
      <button id="bNew" type="button">＋ Yangi doska</button>
    </div>
  </header>

  <main id="viewport">
    <div id="world">
      <svg id="wb" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="answers"></div>
    </div>

    <!-- Bubble doskadan mustaqil harakatlanadi -->
    <div id="bubble" aria-label="Bubble AI">
      <div class="eyes">
        <span class="eye"></span>
        <span class="eye"></span>
      </div>
      <div id="mouth"></div>
    </div>
  </main>

  <div id="toast" role="status"></div>

  <aside id="menu" hidden></aside>

  <footer id="dock">
    <div class="row voice-controls">
      <button class="k" id="bPrevious" type="button">⏮ Oldingi</button>
      <button class="k main" id="bPlay" type="button">▶ Davom</button>
      <button class="k" id="bNext" type="button">Keyingi ⏭</button>
      <button class="k" id="bReplay" type="button">↻</button>
    </div>

    <form id="form" class="in">
      <button class="k sm" id="bPlus" type="button" aria-label="Rasm qo‘shish">＋</button>
      <input
        id="q"
        type="text"
        placeholder="Bubble’dan nimani so‘ramoqchisiz?"
        autocomplete="off"
      >
      <button class="k sm" id="bMic" type="button" aria-label="Mikrofon">🎙</button>
      <button class="go" id="go" type="submit" aria-label="Yuborish">➤</button>
    </form>

    <input id="imageInput" type="file" accept="image/*" hidden>
  </footer>

  <audio id="au" preload="none"></audio>

  <script src="app.js"></script>
</body>
</html>
