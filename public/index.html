
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0f17" id="themeColor">
  <title>Bubble AI — Aqlli o‘qituvchi</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <button id="bProfile" class="profile-trigger" type="button" aria-label="Profil menyusi">
        <img id="telegramAvatar" class="telegram-avatar" alt="" hidden>
        <span class="brand-dot" id="brandDot">●</span>
      </button>
      <strong>Bubble AI</strong>
    </div>

    <div class="top-actions">
      <button id="bMenu" type="button">📚 Tarix</button>
      <button id="bNew" type="button">＋ Yangi doska</button>
    </div>
  </header>

  <div id="profileMenu" hidden>
    <div class="profile-heading">Profil menyusi</div>
    <button id="bTheme" type="button">🌙 Tungi rejim</button>
    <button id="bProfileInfo" type="button">👤 Profil ma’lumotlari</button>
    <button id="bSettings" type="button">⚙️ Sozlamalar</button>
    <button id="bHelp" type="button">❓ Yordam</button>
  </div>

  <main id="viewport">
    <div id="world">
      <svg id="wb" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="answers"></div>
    </div>

    <div id="bubble" aria-label="Bubble AI">
      <div class="eyes">
        <span class="eye"></span>
        <span class="eye"></span>
      </div>
      <div id="mouth"></div>
    </div>
  </main>

  <div id="toast" role="status"></div>

  <aside id="menu" hidden></aside>

  <footer id="dock">
    <div class="row voice-controls">
      <button class="k" id="bPrevious" type="button">⏮ Oldingi</button>
      <button class="k main" id="bPlay" type="button">▶ Davom</button>
      <button class="k" id="bNext" type="button">Keyingi ⏭</button>
      <button class="k" id="bReplay" type="button">↻</button>
    </div>

    <form id="form" class="in">
      <button class="k sm" id="bPlus" type="button" aria-label="Rasm qo‘shish">＋</button>
      <input
        id="q"
        type="text"
        placeholder="Bubble’dan nimani so‘ramoqchisiz?"
        autocomplete="off"
      >
      <button class="k sm" id="bMic" type="button" aria-label="Mikrofon">🎙</button>
      <button class="go" id="go" type="submit" aria-label="Yuborish">➤</button>
    </form>

    <input id="imageInput" type="file" accept="image/*" hidden>
  </footer>

  <audio id="au" preload="none"></audio>

  <script src="app.js"></script>

  <script>
  (() => {
    const webApp = window.Telegram && window.Telegram.WebApp;
    const user = webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user;

    const avatar = document.getElementById('telegramAvatar');
    const dot = document.getElementById('brandDot');

    if (webApp) {
      webApp.ready();
      webApp.expand();
    }

    if (user && user.photo_url) {
      avatar.src = user.photo_url;
      avatar.hidden = false;
      dot.hidden = true;

      avatar.addEventListener('error', () => {
        avatar.hidden = true;
        dot.hidden = false;
      }, { once: true });
    }

    // PROFIL MENYUSI
    const profileButton = document.getElementById('bProfile');
    const profileMenu = document.getElementById('profileMenu');
    const themeButton = document.getElementById('bTheme');
    const themeColor = document.getElementById('themeColor');

    function closeProfileMenu() {
      profileMenu.hidden = true;
    }

    profileButton.addEventListener('click', (event) => {
      event.stopPropagation();
      profileMenu.hidden = !profileMenu.hidden;
    });

    profileMenu.addEventListener('click', (event) => {
      event.stopPropagation();
    });

    document.addEventListener('click', (event) => {
      if (
        !profileMenu.hidden &&
        !profileMenu.contains(event.target) &&
        !profileButton.contains(event.target)
      ) {
        closeProfileMenu();
      }
    });

    // KUN / TUN REJIMI
    function applyTheme(theme) {
      document.body.dataset.theme = theme;

      const isLight = theme === 'light';

      themeButton.textContent = isLight
        ? '🌙 Tungi rejim'
        : '☀️ Kunduzgi rejim';

      themeColor.content = isLight ? '#f4f6fb' : '#0d0f17';

      try {
        localStorage.setItem('bubble-theme', theme);
      } catch (e) {}
    }

    let savedTheme = 'dark';

    try {
      savedTheme = localStorage.getItem('bubble-theme') || 'dark';
    } catch (e) {}

    applyTheme(savedTheme);

    themeButton.addEventListener('click', () => {
      const nextTheme =
        document.body.dataset.theme === 'dark' ? 'light' : 'dark';

      applyTheme(nextTheme);
      closeProfileMenu();
    });

    // HOZIRCHA TAYYORLANAYOTGAN BO‘LIMLAR
    document.getElementById('bProfileInfo').addEventListener('click', () => {
      closeProfileMenu();
      alert('Profil ma’lumotlari bo‘limi keyingi bosqichda ulanadi.');
    });

    document.getElementById('bSettings').addEventListener('click', () => {
      closeProfileMenu();
      alert('Sozlamalar bo‘limi keyingi bosqichda ulanadi.');
    });

    document.getElementById('bHelp').addEventListener('click', () => {
      closeProfileMenu();
      alert('Yordam bo‘limiga Telegram username keyin qo‘shiladi.');
    });

  })();
  </script>

</body>
</html>
