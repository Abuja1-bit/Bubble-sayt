
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f17">
  <title>Bubble AI</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot">●</span>
      <strong>Bubble AI</strong>
    </div>

    <div class="top-actions">
      <button id="bMenu" type="button">☰ Tarix</button>
      <button id="bNew" type="button">＋ Yangi doska</button>
    </div>
  </header>

  <main id="viewport">
    <div id="world">
      <svg id="wb" aria-label="Chizish doskasi"></svg>
      <section id="answers" aria-live="polite"></section>
    </div>

    <div id="zoomControls" aria-label="Doska masshtabi">
      <button id="bZoomIn" type="button" aria-label="Kattalashtirish">＋</button>
      <button id="bZoomOut" type="button" aria-label="Kichraytirish">−</button>
      <button id="bZoomReset" type="button" aria-label="Masshtabni tiklash">⤢</button>
    </div>

    <div id="bubble" aria-label="Bubble AI">
      <div class="eyes">
        <div class="eye" id="eL"></div>
        <div class="eye" id="eR"></div>
      </div>
      <div id="mouth"></div>
    </div>
  </main>

  <div id="toast" role="status"></div>
  <div id="menu" hidden></div>

  <footer id="dock">
    <div class="row voice-controls">
      <button class="k" id="bReplay" type="button">↻ Qayta eshitish</button>
      <button class="k main" id="bPlay" type="button">⏸ Pauza</button>
    </div>

    <form class="in" id="form">
      <input id="imageInput" type="file" accept="image/*" hidden>
      <button type="button" class="k sm" id="bPlus" aria-label="Rasm qo‘shish">＋</button>
      <input id="q" type="text" maxlength="400" autocomplete="off" placeholder="Savolingizni yozing..." aria-label="Savol">
      <button type="button" class="k sm" id="bMic" aria-label="Ovoz orqali yozish">🎙</button>
      <button class="go" id="go" type="submit" aria-label="Yuborish">➤</button>
    </form>
  </footer>

  <audio id="au" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
